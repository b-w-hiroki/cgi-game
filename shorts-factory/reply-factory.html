<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REPLY FACTORY — コメント返信工場</title>
<style>
  :root {
    --bg: #0a0702; --panel: #140e04; --panel-2: #1a1206;
    --line: rgba(240, 170, 60, 0.28); --line-strong: rgba(240, 170, 60, 0.55);
    --amber: #e8a33d; --amber-bright: #ffc456; --amber-dim: #96712f; --amber-faint: #5c4620;
    --green: #7dd87d; --red: #d24a3e; --cyan: #4ec3c9;
    --font: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--amber); font-family: var(--font); font-size: 13px;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, transparent 1px, transparent 3px);
    z-index: 999;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #191106, #100a03); flex-wrap: wrap;
  }
  .logo {
    display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; letter-spacing: 3px;
    color: var(--amber-bright); text-shadow: 0 0 12px rgba(255,196,86,0.35); white-space: nowrap;
  }
  .logo::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--amber-bright); box-shadow: 0 0 10px var(--amber-bright); }
  .subtitle { color: var(--amber-dim); font-size: 11px; letter-spacing: 2px; border-left: 1px solid var(--line); padding-left: 16px; }
  .hbtn {
    margin-left: auto; background: none; border: 1px solid var(--line); color: var(--amber-dim);
    font-family: var(--font); font-size: 10px; letter-spacing: 2px; padding: 4px 12px; cursor: pointer;
    text-decoration: none; white-space: nowrap;
  }
  .hbtn:hover { color: var(--amber-bright); border-color: var(--line-strong); }
  main { flex: 1; padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; max-width: 900px; width: 100%; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); }
  .panel-title {
    padding: 10px 14px; font-size: 11px; letter-spacing: 2px; color: var(--amber-bright);
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
  }
  .panel-title::before { content: "■"; font-size: 8px; }
  .panel-title .jp { color: var(--amber-dim); letter-spacing: 1px; }
  .form-block { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  textarea.tinput {
    width: 100%; min-height: 120px; resize: vertical;
    background: #0c0803; border: 1px solid var(--line-strong); color: var(--amber-bright);
    font-family: var(--font); font-size: 12px; line-height: 1.8; padding: 10px 12px; outline: none;
  }
  textarea.tinput:focus { box-shadow: 0 0 12px rgba(240,170,60,0.25); }
  textarea.tinput::placeholder { color: var(--amber-faint); }
  #gen-btn {
    align-self: flex-end;
    background: var(--amber); color: #100a03; border: none; font-family: var(--font); font-weight: 700;
    font-size: 12px; letter-spacing: 2px; padding: 9px 22px; cursor: pointer;
  }
  #gen-btn:hover { background: var(--amber-bright); box-shadow: 0 0 14px rgba(255,196,86,0.45); }
  .gbtn {
    background: none; border: 1px solid var(--line); color: var(--amber-dim); font-family: var(--font);
    font-size: 9px; letter-spacing: 1px; padding: 3px 10px; cursor: pointer;
  }
  .gbtn:hover { color: var(--amber-bright); border-color: var(--line-strong); }
  #reply-list { padding: 10px 14px; }
  .reply-row {
    border: 1px solid var(--line); padding: 10px 12px; margin-bottom: 8px;
    opacity: 0; animation: fadein 0.3s forwards;
  }
  @keyframes fadein { to { opacity: 1; } }
  .reply-row .head { display: flex; gap: 8px; align-items: center; margin-bottom: 5px; }
  .type-chip { font-size: 9px; letter-spacing: 1px; padding: 1px 7px; font-weight: 700; }
  .type-chip.question { border: 1px solid var(--cyan); color: var(--cyan); }
  .type-chip.praise { border: 1px solid var(--green); color: var(--green); }
  .type-chip.negative { border: 1px solid var(--red); color: var(--red); }
  .type-chip.request { border: 1px solid var(--amber-bright); color: var(--amber-bright); }
  .type-chip.other { border: 1px solid var(--line-strong); color: var(--amber-dim); }
  .reply-row .orig { color: var(--amber-dim); font-size: 11px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reply-row .reply { color: var(--amber-bright); font-size: 12px; line-height: 1.7; }
  .empty-note { color: var(--amber-faint); text-align: center; padding: 40px 0; letter-spacing: 2px; font-size: 10px; }
  .note { padding: 8px 14px; font-size: 10px; color: var(--amber-faint); border-top: 1px solid var(--line); line-height: 1.7; }
  footer {
    display: flex; align-items: center; gap: 14px; padding: 8px 18px; border-top: 1px solid var(--line);
    background: #100a03; font-size: 11px;
  }
  footer .cursor { color: var(--amber-bright); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  footer .version { margin-left: auto; color: var(--amber-faint); letter-spacing: 2px; font-size: 9px; }
  @media (max-width: 700px) { .subtitle { display: none; } }
</style>
</head>
<body>

<header>
  <div class="logo">REPLY FACTORY</div>
  <div class="subtitle">コメント返信工場 — 返信率はアルゴリズムに効く</div>
  <a class="hbtn" href="./index.html">← SHORTS FACTORY</a>
</header>

<main>
  <section class="panel">
    <div class="panel-title">INPUT <span class="jp">動画に付いたコメントを1行1件で貼り付け</span></div>
    <div class="form-block">
      <textarea id="comments" class="tinput" placeholder="どこで買えますか?&#10;これほんとに効果あるの?&#10;めっちゃ良さそう!&#10;他の色も紹介してほしい" spellcheck="false"></textarea>
      <button id="gen-btn">返信案を生成</button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">REPLIES <span class="jp">分類 → 返信案</span>
      <button class="gbtn" id="copy-all" style="margin-left:auto;display:none">全部コピー</button>
    </div>
    <div id="reply-list"><div class="empty-note">STANDBY — コメントを貼って生成してください</div></div>
    <div class="note">コメントを「質問/称賛/ネガ/要望/その他」に自動分類し、伸びやすい返信のトーン(即レス感・具体・追い質問)で案を出します。ネガコメには反論せず事実+誠実さで返すのが鉄則です。</div>
  </section>
</main>

<footer>
  <span class="cursor">▶</span>
  <span id="status">返信テンプレ 5分類 × 各3パターン搭載</span>
  <span class="version">REPLY FACTORY v1.0 · SHORTS FACTORY SUITE</span>
</footer>

<script>
"use strict";
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = arr => arr[rand(0, arr.length - 1)];
const $ = id => document.getElementById(id);

/* 判定は上から順(ネガ→要望→質問→称賛)。「効果あるの?ステマ」は質問でなくネガに落とす */
const TYPES = {
  negative: { label: "ネガ", re: /微妙|嘘|うそ|ステマ|怪しい|高い|高すぎ|意味ない|効果ない|効果あるの|やらせ|宣伝/ },
  request:  { label: "要望", re: /してほしい|して欲しい|お願い|やって|出して|紹介して|見たい|比較して/ },
  question: { label: "質問", re: /[??]|どこ|どうやって|どっち|どれ|いくら|何円|教えて|方法|やり方/ },
  praise:   { label: "称賛", re: /いい|良い|良さそう|よさそう|好き|最高|かわいい|可愛い|すごい|神|欲しい|ほしい|参考に|助かる|気になる/ },
  other:    { label: "その他", re: /$^/ },
};
function classify(c) {
  for (const [k, t] of Object.entries(TYPES)) if (k !== "other" && t.re.test(c)) return k;
  return "other";
}

const REPLIES = {
  question: [
    "ご質問ありがとうございます!プロフィールのリンクからチェックできます🙌 他にも気になることがあれば何でもどうぞ!",
    "見てくださってありがとうございます!詳細はプロフのリンクにまとめてます✨ 分からなければまた聞いてください!",
    "ありがとうございます!概要欄(プロフ)に載せてます!ちなみにどんな用途で検討されてますか?👀",
  ],
  negative: [
    "ご意見ありがとうございます!実際に自分で使った上での感想ですが、感じ方には個人差があると思います。合う合わないの参考になれば嬉しいです🙏",
    "コメントありがとうございます。ステマではなくPRと明記した上で、実際に使って良かったものだけ紹介しています🙏 疑問点があれば具体的にお答えします!",
    "率直なご意見ありがとうございます!価格は正直安くないですが、私は◯◯の点で元が取れると感じました。参考までに🙏",
  ],
  praise: [
    "ありがとうございます!!そう言ってもらえて嬉しいです😭 使ってみたら感想もぜひ聞かせてください!",
    "嬉しいコメントありがとうございます✨ フォローしておくと続きの検証も見れます🙌",
    "ありがとうございます!同じ悩みの人に届いてほしくて作りました😭 気になる点あれば何でも聞いてください!",
  ],
  request: [
    "リクエストありがとうございます!めっちゃ助かります🙌 次の動画で取り上げますね。フォローして待っててください!",
    "その企画いいですね…!やります!✨ 他にも見たいものがあればコメントで教えてください!",
    "ありがとうございます!実は次回まさにそれを準備中です👀 お楽しみに!",
  ],
  other: [
    "コメントありがとうございます🙌 見てもらえるだけで励みになります!",
    "ありがとうございます!よかったら他の動画もチェックしてみてください✨",
    "コメント嬉しいです😊 気になることがあれば何でも聞いてください!",
  ],
};

let lastRows = [];
$("gen-btn").addEventListener("click", () => {
  const lines = $("comments").value.split("\n").map(s => s.trim()).filter(Boolean);
  if (!lines.length) { $("comments").focus(); $("status").textContent = "コメントを1行1件で貼り付けてください"; return; }

  const list = $("reply-list");
  list.innerHTML = "";
  lastRows = lines.map(c => {
    const type = classify(c);
    return { c, type, reply: pick(REPLIES[type]) };
  });

  lastRows.forEach((r, i) => {
    const row = document.createElement("div");
    row.className = "reply-row";
    row.style.animationDelay = (i * 80) + "ms";
    row.innerHTML =
      `<div class="head"><span class="type-chip ${r.type}">${TYPES[r.type].label}</span><span class="orig"></span><button class="gbtn">COPY</button></div>` +
      `<div class="reply"></div>`;
    row.querySelector(".orig").textContent = r.c;
    row.querySelector(".reply").textContent = r.reply;
    row.querySelector("button").addEventListener("click", async e => {
      try { await navigator.clipboard.writeText(r.reply); e.target.textContent = "COPIED"; setTimeout(() => e.target.textContent = "COPY", 1200); }
      catch { e.target.textContent = "ERROR"; }
    });
    list.appendChild(row);
  });

  $("copy-all").style.display = "";
  const counts = {};
  lastRows.forEach(r => counts[r.type] = (counts[r.type] || 0) + 1);
  $("status").textContent = `${lines.length}件を分類: ` +
    Object.entries(counts).map(([k, n]) => `${TYPES[k].label}${n}`).join(" / ");
});

$("copy-all").addEventListener("click", async e => {
  const text = lastRows.map(r => `▼ ${r.c}\n${r.reply}`).join("\n\n");
  try { await navigator.clipboard.writeText(text); e.target.textContent = "COPIED"; setTimeout(() => e.target.textContent = "全部コピー", 1200); }
  catch { e.target.textContent = "ERROR"; }
});
</script>
</body>
</html>
